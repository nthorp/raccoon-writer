name: RaccoonWriter
options:
  bundleIdPrefix: com.raccoonwriter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ImageWriterCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  RaccoonWriter:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - RaccoonWriter.entitlements
    dependencies:
      - package: ImageWriterCore
        product: ImageWriterCore
    settings:
      base:
        PRODUCT_NAME: RaccoonWriter
        PRODUCT_BUNDLE_IDENTIFIER: com.raccoonwriter.app
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/RaccoonWriter.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        # Xcode ignores ENABLE_HARDENED_RUNTIME for ad-hoc ("-") signing, so ask for it
        # directly. scripts/build.sh fails if the signature lacks the runtime flag.
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
        ARCHS: "arm64 x86_64"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          # Library validation under the Hardened Runtime refuses the separately signed
          # Xcode 16 .debug.dylib (ad-hoc signatures have no Team ID to match), and the
          # app dies at launch. Only SwiftUI previews use that dylib.
          ENABLE_DEBUG_DYLIB: NO
        Release:
          ONLY_ACTIVE_ARCH: NO
          # Stripping only happens when DEPLOYMENT_POSTPROCESSING is on, and plain
          # `xcodebuild build` leaves it off. The two STRIP_ values are the defaults,
          # spelled out because they do nothing without it. Symbols stay in the dSYM.
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
schemes:
  RaccoonWriter:
    build:
      targets:
        RaccoonWriter: all
    run:
      config: Debug
    archive:
      config: Release
